# nginx reverse proxy for the hosted MCP server (port 9000) with TLS.
#
# Why: Claude Desktop custom connectors require HTTPS, and a plain-http MCP on a
# public IP is unauthenticated + unencrypted. This terminates TLS at nginx and
# proxies to the MCP on localhost. Final URL: https://<your-domain>/mcp/
#
# Setup (on the server, as root):
#   1. Point a DNS A record at this box:  scraper.example.com -> 107.174.35.26
#   2. apt-get install -y nginx certbot python3-certbot-nginx
#   3. Replace scraper.example.com below with your domain.
#   4. cp deployment/nginx-scraper-mcp.conf /etc/nginx/sites-available/scraper-mcp
#      ln -s /etc/nginx/sites-available/scraper-mcp /etc/nginx/sites-enabled/
#      nginx -t && systemctl reload nginx
#   5. certbot --nginx -d scraper.example.com      # auto-adds the 443 block + redirect
#   6. Open 80 + 443 in the firewall; you can now close 9000 to the public and
#      (optionally) rebind the MCP to localhost: set MCP_HOST=127.0.0.1 in
#      reddit_scraper_mcp.service so 9000 isn't reachable except via nginx.
#
# Then connect Claude Desktop / Code with:  https://scraper.example.com/mcp/

server {
    listen 80;
    listen [::]:80;
    server_name scraper.example.com;   # <-- change to your domain

    location / {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # MCP uses streamable-HTTP / SSE: stream chunks straight through, never
        # buffer or cache, and allow long-lived connections.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }
}
